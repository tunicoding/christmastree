<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="3D yılbaşı ağacını süsle.">
<title>Yılbaşı Atölyesi</title>
<style>
:root{color-scheme:light;--page:#ebe9e2;--paper:#f5f3ed;--ink:#2c302b;--dim:#63645b;--line:#d8d6cc;--accent:#773a33;--wall:#cfcbc0;--floor:#b9b5a7;--beam:#fff8e544}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.4 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}
.shell{max-width:1400px;margin:auto;padding:0 clamp(12px,4vw,58px) 24px}.mast{height:70px;display:flex;justify-content:space-between;align-items:center;gap:16px}.mast h1{font:400 clamp(26px,3.4vw,41px)/1 Georgia,serif;letter-spacing:-.035em;margin:0}.mast p{margin:0;color:var(--dim);font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 318px;grid-template-rows:1fr auto;outline:1px solid #cfccc2;background:var(--paper)}
.stage{position:relative;min-height:clamp(545px,72svh,790px);isolation:isolate;overflow:hidden;background:linear-gradient(110deg,var(--beam),#ffffff00 71%),linear-gradient(to bottom,var(--wall) 0 69%,var(--floor) 69%)}.stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(to bottom,transparent 68.8%,#3b372322 69%,transparent 70%)}.stage::after{content:"";position:absolute;z-index:-1;left:-14%;top:-7%;width:58%;height:77%;transform:skew(25deg) rotate(-13deg);background:linear-gradient(90deg,transparent,var(--beam) 30% 83%,transparent);pointer-events:none}
.stage[data-look=ember]{--wall:#a78c75;--floor:#8b7363;--beam:#f3c0843e}.stage[data-look=frost]{--wall:#c4ced0;--floor:#a8b7b9;--beam:#eaffff48}
.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}.stage canvas:active{cursor:grabbing}.stage[data-armed=true] canvas{cursor:crosshair}.stage.dragging canvas{cursor:copy}
.snow{position:absolute;inset:0;overflow:hidden;pointer-events:none}.flake{position:absolute;top:-4%;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#fffefa;box-shadow:0 0 2px #434b4940;opacity:0;will-change:transform,opacity;animation:snowfall var(--d) var(--delay) linear infinite}
@keyframes snowfall{0%{transform:translate3d(0,-10px,0);opacity:0}12%,75%{opacity:var(--o)}100%{transform:translate3d(var(--drift),var(--fall),0);opacity:0}}
@media(prefers-reduced-motion:reduce){.flake{animation:none!important;display:none}}
.view-actions{position:absolute;z-index:1;bottom:13px;right:14px;display:flex;align-items:center;background:#f7f4ebdc;border:1px solid #928a784d}.view-actions button{border:0;border-right:1px solid #928a7840;background:transparent;font-size:22px;line-height:1;min-width:43px;min-height:40px}.view-actions button:last-child{border:0}.view-actions button:hover{background:#fff9eb}.status{grid-column:1;grid-row:2;margin:0;border-top:1px solid var(--line);min-height:35px;padding:9px 13px;color:var(--dim);font-size:12px}
.shelf{grid-column:2;grid-row:1/3;min-width:0;border-left:1px solid var(--line);padding:14px 15px 13px}.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:9px;padding:2px 0 10px}.shelf h2{font-size:15px;line-height:1.2;font-weight:640;margin:0}.count{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}.help{position:absolute;width:1px;height:1px;margin:-1px;clip-path:inset(50%);overflow:hidden}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:#efede5}.item{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;justify-items:center;align-content:center;gap:1px;min-height:77px;min-width:0;background:transparent;padding:4px 1px;touch-action:none;user-select:none;cursor:grab}.item:hover{background:#e3ded2}.item[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--accent);background:#eaddd2;cursor:grabbing}.item img{width:56px;height:51px;object-fit:contain;pointer-events:none}.item span{font-size:10px;color:#57564d;white-space:nowrap}
.shelf-actions{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;margin:11px 0 17px}.random{border:1px solid #5f332e;background:#763d34;color:#fff9ee;min-height:38px;padding:0 8px;white-space:nowrap;font-weight:650;font-size:11px}.random:hover{background:#60312b}.shelf-actions button:not(.random){border:0;background:transparent;font-size:11px;min-height:36px;padding:0 1px;text-decoration:underline;text-underline-offset:3px}
.appearance{border-top:1px solid var(--line);padding-top:9px;display:grid;gap:8px}.appearance-head{color:var(--dim);font-size:11px}.appearance-row{display:flex;gap:0;border:1px solid var(--line)}.appearance-row button{flex:1;background:transparent;border:0;border-right:1px solid var(--line);padding:5px 4px;min-height:34px;font-size:11px}.appearance-row button:last-child{border-right:0}.appearance-row button:hover,.appearance-row button[aria-pressed=true]{background:#e5e0d5}.appearance-row button[aria-pressed=true]{font-weight:650}.switches{display:flex;gap:8px}.switches button{background:transparent;border:1px solid var(--line);min-height:35px;padding:5px 10px;font-size:11px}.switches button[aria-pressed=true]{background:#e5e0d5}
.ghost{position:fixed;z-index:8;pointer-events:none;filter:drop-shadow(0 5px 6px #0007);transform:translate(-50%,-48%);display:grid;place-items:center;width:62px;height:60px}.ghost img{width:62px;height:58px;object-fit:contain}.error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#ebe9e2d9;color:var(--ink)}
@media(max-width:760px){.shell{padding-top:0}.mast{min-height:58px;height:auto;padding:10px 0}.mast p{display:none}.grid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}.stage{min-height:0;height:clamp(325px,55svh,520px);grid-row:1}.status{grid-row:2;padding:7px 10px;min-height:34px}.shelf{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--line);padding:11px 10px}.items{grid-template-columns:repeat(6,minmax(0,1fr))}.item{min-height:54px}.item img{width:37px;height:35px}.item span{font-size:8px}.shelf-actions{margin:8px 0 10px}.appearance{grid-template-columns:minmax(0,1fr);gap:6px}.view-actions{bottom:8px;right:8px}}
@media(max-width:359px){.items{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body><main class="shell">
<header class="mast"><h1>Yılbaşı Atölyesi</h1><p>Süsü seç veya ağaca sürükle.</p></header>
<div class="grid">
<section class="stage" id="stage" aria-label="3D yılbaşı ağacı"><div id="snowfall" class="snow" aria-hidden="true"></div><div id="error" class="error" hidden>3D sahne açılamadı. Tarayıcıda donanım hızlandırmayı açıp yeniden dene.</div>
<div class="view-actions"><button id="left" type="button" aria-label="Ağacı sola çevir">↶</button><button id="right" type="button" aria-label="Ağacı sağa çevir">↷</button></div></section>
<p class="status" id="hint" role="status">Süsü seçip dala dokun veya sürükleyip bırak.</p>
<aside class="shelf" aria-label="Süsler"><div class="shelf-head"><h2>Süsler</h2><span class="count" id="count">0 süs</span></div>
<div class="items" id="items"></div>
<div class="shelf-actions"><button id="random" class="random" type="button">Rastgele süsle</button><button id="undo" type="button" disabled>Geri al</button><button id="clear" type="button" disabled>Temizle</button></div>
<div class="appearance"><div class="appearance-head">Oda ışığı</div><div class="appearance-row" role="group" aria-label="Oda ışığı"><button type="button" data-look="classic" aria-pressed="true">Çam odası</button><button type="button" data-look="ember" aria-pressed="false">Şömine</button><button type="button" data-look="frost" aria-pressed="false">Kış sabahı</button></div><div class="switches"><button id="lights" type="button" aria-pressed="false">Işık zinciri</button><button id="snow-toggle" type="button" aria-pressed="true" aria-label="Kar yağışı">Kar: Açık</button></div></div></aside></div>
<div id="ghost" class="ghost" hidden aria-hidden="true"></div>
</main><script type="module">
import('./tree.js').catch(()=>{document.getElementById('error').hidden=false;document.getElementById('hint').textContent='Sahne yüklenemedi.'});
</script></body></html>
